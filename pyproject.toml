[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "droplet-formation"
version = "1.0.0"
description = "Axisymmetric Stokes solver for droplet formation in a microfluidic channel."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Droplet formation model contributors"}]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
droplet-formation = "droplet_formation.cli:main"

[tool.setuptools.packages.find]
include = ["droplet_formation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
